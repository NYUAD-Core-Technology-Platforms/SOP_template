# --- Scope ---
sop_type: "specific_lab_procedure"
sop_type_description: >
  This document applies to all personnel involved in experiments using the
  KIT-MEG system at NYUAD. It outlines basic operating procedures and emergency
  protocols. This Standard Operating Procedure (SOP) specifically addresses
  the use of the KIT-MEG (Magnetoencephalography) system developed by Kyoto
  Institute of Technology. Please note, this system is restricted to adult
  participants; underage participants are NOT permitted.

# --- 1. Emergency Shutdown ---
emergency_shutdown: |
  In the event of an emergency while the MEG system is on:
  1. If there is a human subject in the magnetically shielded room (MSR), immediately open the door using the emergency release (instructions posted on the door of the MSR) to allow them to leave.
  2. On the MEG Main PC, open MEG160 (found on the Desktop).
  3. In the menu bar at the top of the program window, click: Acquire → Shutdown DAQ → Shut Down Data Acquisition Equipment.
  4. If the system is turned off at the time of the emergency, no additional shutdown procedure is required.

# --- 4. Process Description ---
description: |
  This procedure provides users with instructions on the proper use of the
  magnetoencephalogram (MEG) and the corresponding data acquisition (DAQ)
  system, located in Room 008 of Building A2, New York University Abu Dhabi.

  The MEG is used to measure very small changes in magnetic fields, most often
  in studies of human brain function. The system consists of the following
  components:
  - 256 channel MEG system, including a supine bed, helmet, and liquid helium Dewar
  - 1 Magnetically-shielded room
  - 4 DAQ PCs and a signal processing system
  - 1 MEG Main PC for recording control
  - 1 Stimulus PC for experiment control
  - 1 head position monitoring system
  - Video and audio monitoring systems

  The KIT-MEG is equipped with a pick up coil which is a coaxial type
  first-order gradiometer with 50-mm base line. The magnetic field resolution
  of the system is about 4 fT/Hz^0.5. The unique feature of the system is the
  gantry-free horizontal dewar, fabricated through the "ship-in-a-bottle approach".

frequency: "as needed"
duration: "1-2 hours per session"

# --- 5. Safety Literature Review & Hazard Summary ---
hazardous_substances:
  - name: "Liquid Helium"
    hazards: >
      Damage to the helium Dewar could cause liquid helium leakage and boil off.
      Extended exposure to gaseous helium may cause frostbite. Inhalation in
      excessive amounts can cause dizziness, nausea, vomiting, loss of
      consciousness, and death.
  - name: "Compressed Air (MSR door)"
    hazards: >
      Failure of the building's air compression system or a power outage may
      result in difficulty opening the door to the magnetically shielded room,
      which could prevent individuals from quickly exiting the room.

other_hazards:
  - "Electricity: The MEG lab houses multiple electrical components. Mishandling may cause shock leading to minor to severe injuries, and death."
  - "Fire: Electrical components could malfunction or be mishandled, leading to fire risk."
  - "Moving Parts: The MSR door closes with a compressed air system. Improper procedures could cause limb injuries requiring off-site medical treatment."
  - "Slip / Trip / Fall: Individuals could slip/trip/fall on materials left on the ground."
  - "Confined Spaces: The MSR is a confined space; the door must be closed during all recordings. Individuals inside may feel anxiety or be temporarily stuck."

safety_guidelines: |
  - Do not attempt to fill the helium tank or adjust the helium level unless supervised or approved by the responsible person or approved contractor personnel.
  - Do not shock or otherwise damage the liquid helium Dewar.
  - Regularly check the surface of the Dewar for scratches/cracks.
  - Do not adjust or tamper with any electronic components connecting the SQUID sensors to the DAQ system without direct supervision or approval from the responsible person.
  - Ensure that the emergency and manual release instructions are always posted on the external surface of the MSR, immediately next to the door.
  - Ensure that the manual release key is located on the external surface of the MSR, immediately next to the door.
  - In the event of an earthquake, ensure that any individual inside the MSR is immediately removed.
  - Do not leave the laboratory while a research participant under your supervision is in the MSR.
  - In the case of a power failure, contact the responsible person.

references:
  - "New NYUAD MEG Lab Manual"
  - "https://drive.google.com/drive/u/0/folders/1twdv0TF2nTZzUj2tnUa6J8Q1mNhdhwHQ"

