  reference_number: "2692RA"
  location: "AssessNET, MEG lab (room 008, A2), shared with the user, CTP drive"

# --- 6. Storage Requirements ---
storage_requirements: |
  At the end of the experiment, place all accessories used during the session
  back to their appropriate location.

  All handling of the liquid helium is to be done by approved personnel employed
  by the external contractor who provides the service (Air Products Gulf Gas LLC).

  Components of the MEG system should remain in their current location and
  configuration unless changes are approved by the responsible person.

# --- 7. PPE ---
ppe:
  street_clothing: true
  gloves: true
  gloves_type: "as appropriate"
  safety_goggles: false
  safety_glasses: false
  face_shield: false
  lab_coat: false
  flame_resistant_lab_coat: false
  other: ""

# --- 8. Waste Disposal ---
waste_disposal: |
  The following items must be disposed of once they come in contact with human participants:
  - Tissues
  - Disposable ear pieces/head phones
  - Tape

  The following items must be wiped with 70% isopropyl alcohol solution for sterilization:
  - Head position indicator coils
  - Response boxes

  The following items must be washed in a traditional laundry machine:
  - The bedding and blankets kept within the MSR
  - Hospital scrubs worn by research participants

  Place dirty linen in the special container (dirty linen).

# --- 10. Training ---
training:
  general:
    safety_orientation: false
    risk_assessment: false
    lab_safety_induction: false
    bloodborne_pathogens: false
    xray_safety: false
    compressed_gas: false
    biosafety_induction: false
    other: >
      In compliance with the Ethics Review Board (ERB) of NYUAD, all researchers
      working with human subjects must complete the Human Subjects Research
      training available through the Collaborative Institutional Training
      Initiative (CITI). All research protocols must be approved by the
      appropriate ERBs.
  lab_specific:
    review_sds: false
    review_sop: true
    hands_on_training: true
    other: "CITI ERB training"
  records_location: "CTP drive, SDS, SOP and RA are located in the room"
  training_content:
    - "Safe and independent operation of the instrument"
    - "Emergency procedure"
    - "Standard sample measurement and validation of the results"
    - "Safety briefing: Operators are made aware of risks and control measures"
    - "Assessment of the competency of the user"
  evidence_of_competency: >
    Once the training is completed, CTP personnel will assess the competency
    of the user before granting him/her access to the system. The authorization
    to book the system serves as a certificate of competency. Failure to adhere
    to this SOP will result in the withdrawal of access to the MEG-KIT system.

# --- 11. Prior Approvals ---
prior_approval_required: true
prior_approval_details: >
  All research projects involving human participants must obtain prior approval
  from the ERB committee. The integration of the MEG-KIT system into the ERB
  protocol is mandatory and approval must be secured before implementation.
  The MEG-KIT is exclusively designated for adult participants.

