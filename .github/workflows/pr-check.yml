name: Validate & Build SOPs (PR Check)

on:
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate SOP data
        run: python scripts/validate.py

      - name: Build SOPs
        run: python scripts/build_sops.py --all
